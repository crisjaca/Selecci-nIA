<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · SelecciónIA</title><link rel="stylesheet" href="assets/css/estilos.css"></head><body>
<main class="auth"><div class="caja"><a class="marca" href="index.html">SelecciónIA</a>
<h1>Iniciar sesión</h1><p class="sub">Ingresa con el correo de tu cuenta.</p>
<div id="msg" class="alerta" hidden role="alert"></div>
<form id="form"><label for="correo">Correo</label><input id="correo" name="correo" type="email" autocomplete="username" required>
<label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required>
<button class="btn" type="submit">Iniciar sesión</button></form>
<p class="pie">¿Tu empresa aún no tiene cuenta? <a href="registro.html">Crea una cuenta de empresa</a></p></div></main>
<script type="module" src="src/modulos/rf11-autenticacion/presentacion/login.js"></script></body></html>
